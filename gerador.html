<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEXUS - MASTER ADMIN</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .box { border: 2px solid #00ff41; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 0 20px #00ff41; }
        input { background: #000; border: 1px solid #00ff41; color: #fff; padding: 10px; width: 250px; text-align: center; margin-bottom: 20px; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="box">
    <h1>NEXUS GENERATOR</h1>
    <p>GERAR KEY DE ACESSO VIP</p>
    <input type="text" id="keyOutput" readonly placeholder="A KEY APARECERÁ AQUI">
    <br>
    <button onclick="gerarESalvar()">GERAR E ATIVAR KEY</button>
</div>

<script>
  // CONFIGURAÇÃO DO SEU FIREBASE (Pegue no Console do Firebase)
  const firebaseConfig = {
    apiKey: "AIzaSyA0Q2b-zUJRT7VBrsKRdsln7UR9hLy_YKY",
    databaseURL: "https://console.firebase.google.com/u/0/project/alphagen-p9d3i/database/alphagen-p9d3i-default-rtdb/data/~2F"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function gerarESalvar() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let randomStr = "";
    for (let i = 0; i < 8; i++) {
        randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    const novaKey = "NEXUS-" + randomStr;
    
    // Salva no Firebase
    database.ref('Keys/' + novaKey).set({
      status: "ativo"
    }).then(() => {
        document.getElementById("keyOutput").value = novaKey;
        alert("KEY GERADA!");
    }).catch((error) => {
        alert("ERRO AO SALVAR: " + error);
    });
  }
</script>
</body>
</html>
