<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS XITER VIP</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #0d0208;
            --glow: 0 0 10px #00ff41, 0 0 20px #00ff41;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Efeito de Scanline da Matrix */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--neon-green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: var(--glow);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hack-card {
            border: 1px solid var(--neon-green);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 65, 0.05);
            box-shadow: inset 0 0 5px rgba(0, 255, 65, 0.2);
        }

        .label {
            font-weight: bold;
            font-size: 14px;
        }

        /* Switch Customizado Matrix */
        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border: 1px solid var(--neon-green);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 2px;
            background-color: var(--neon-green);
            transition: .4s;
            box-shadow: var(--glow);
        }

        input:checked + .slider { background-color: rgba(0, 255, 65, 0.3); }
        input:checked + .slider:before { transform: translateX(25px); }

        .console {
            margin-top: 20px;
            font-size: 10px;
            height: 60px;
            overflow-y: hidden;
            border: 1px solid #111;
            padding: 5px;
            color: #008f11;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="title">NEXUS XITER VIP</h2>
        <small id="status">STATUS: SHIZUKU ACTIVE</small>
    </div>

    <div class="container">
        <div class="hack-card">
            <span class="label">Audio ESP (Wall Hearing)</span>
            <label class="switch">
                <input type="checkbox" onchange="applyHack('audio', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="hack-card">
            <span class="label">Damage Plus (Damage VIP)</span>
            <label class="switch">
                <input type="checkbox" onchange="applyHack('damage', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="hack-card">
            <span class="label">Munição Infinita</span>
            <label class="switch">
                <input type="checkbox" onchange="applyHack('ammo', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="console" id="log">
        > NEXUS_SYSTEM_READY...<br>
        > WAITING_FOR_USER_COMMAND...
    </div>

    <script>
        // Função para log no console do painel
        function log(msg) {
            const console = document.getElementById('log');
            console.innerHTML = "> " + msg + "<br>" + console.innerHTML;
        }

        function applyHack(type, active) {
            if (typeof Nexus === 'undefined') {
                log("<span style='color:red'>ERRO: Ponte Nexus não encontrada!</span>");
                return;
            }

            switch(type) {
                case 'audio':
                    // Offset: 0x7ef9cb0 | Patch: MOV W0, #0 / RET
                    const audioPatch = active ? "00008052C0035FD6" : "ORIGINAL_BYTES";
                    Nexus.patchMemory("7ef9cb0", audioPatch);
                    log("AUDIO_ESP: " + (active ? "ENABLED" : "DISABLED"));
                    break;

                case 'damage':
                    // Offset de Exemplo | Patch: MOV W0, #1 / RET
                    const damagePatch = active ? "20008052C0035FD6" : "ORIGINAL_BYTES";
                    Nexus.patchMemory("39b7988", damagePatch);
                    log("DAMAGE_VIP: " + (active ? "ENABLED" : "DISABLED"));
                    break;

                case 'ammo':
                    // Exemplo para Munição Infinita
                    Nexus.patchMemory("OFFSET_AMMO", active ? "20008052C0035FD6" : "ORIGINAL");
                    log("INF_AMMO: " + (active ? "ENABLED" : "DISABLED"));
                    break;
            }
        }
    </script>
</body>
</html>
