<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: rgba(0,0,0,0.8); color: #00ff41; font-family: monospace; padding: 15px; }
        .mod-item { 
            display: flex; justify-content: space-between; 
            padding: 10px; border: 1px solid #004400; margin-bottom: 5px;
            background: black; border-radius: 8px;
        }
        .btn-logar {
            background: #00ff41; color: black; border: none; padding: 10px;
            width: 100%; font-weight: bold; margin-top: 10px;
        }
        .hidden { display: none; }
        /* Switch */
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        input:checked + .slider { background-color: #00ff41; }
    </style>
</head>
<body>

    <div id="login">
        <h3>NEXUS INJECTOR</h3>
        <input type="text" id="k" placeholder="KEY" style="width:80%; padding:8px; background:black; color:#0f0; border:1px solid #0f0;">
        <button class="btn-logar" onclick="logar()">ENTRAR</button>
    </div>

    <div id="painel" class="hidden">
        <h3>PAINEL FF VIP</h3>
        
        <div class="mod-item">
            <span>AUTO HEADSHOT</span>
            <label class="switch">
                <input type="checkbox" onchange="enviarComando('headshot', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mod-item">
            <span>AIMLOCK</span>
            <label class="switch">
                <input type="checkbox" onchange="enviarComando('aimlock', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        function logar() {
            if(document.getElementById('k').value === "MATRIX-2024") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('painel').classList.remove('hidden');
            } else { alert("KEY ERRADA!"); }
        }

        // ESTA FUNÇÃO FALA COM O SKETCHWARE
        function enviarComando(funcao, status) {
            if (window.Android) {
                window.Android.fazerAcao(funcao, status);
            }
        }
    </script>
</body>
</html>
