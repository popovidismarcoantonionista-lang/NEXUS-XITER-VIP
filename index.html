<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS VIP</title>
    <style>
        body { background-color: black; margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        .login-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 20, 0, 0.95); padding: 30px; border: 2px solid #00FF00;
            text-align: center; color: #00FF00; box-shadow: 0 0 20px #00FF00; z-index: 10;
            border-radius: 15px; width: 280px;
        }
        input { 
            background: black; border: 1px solid #00FF00; color: #00FF00; 
            padding: 12px; margin-top: 15px; width: 90%; text-align: center;
            outline: none; font-weight: bold; border-radius: 5px;
        }
        /* Botão estilizado como link para não dar refresh */
        .btn-link {
            display: block; background: #00FF00; color: black; padding: 14px;
            margin-top: 25px; text-decoration: none; font-weight: bold;
            text-transform: uppercase; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="login-box">
        <h2 style="letter-spacing: 2px;">NEXUS XITER VIP</h2>
        <input type="text" id="keyInput" placeholder="COLE SUA KEY AQUI">
        <a href="javascript:void(0);" class="btn-link" onclick="validar()">LOGAR NO MOD</a>
    </div>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0101010101";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px arial';
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);

        // Lógica de Validação
        function validar() {
            const key = document.getElementById('keyInput').value.trim();
            // Verifique se a KEY aqui é EXATAMENTE a que você está digitando
            if (key === "NEXUS-2026-VIP") {
                window.location.replace("sucesso.login.html");
            } else {
                alert("KEY INCORRETA!");
            }
        }
    </script>
</body>
</html>
