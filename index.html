<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS VIP - ENCRYPTED ACCESS</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-green: #003b00;
            --bg-dark: rgba(0, 0, 0, 0.85);
        }

        canvas#matrix { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; 
        }
        
        body { 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; color: var(--neon-green); 
        }

        .auth-container {
            width: 90%; max-width: 350px; 
            background: var(--bg-dark);
            border: 2px solid var(--neon-green);
            border-radius: 5px; padding: 50px 30px; 
            text-align: center; position: relative;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
            border-style: double;
        }

        .logo-title { 
            font-size: 35px; letter-spacing: 8px; font-weight: bold; 
            text-shadow: 2px 2px 10px var(--neon-green); margin-bottom: 2px; 
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--dark-green); }
            50% { text-shadow: -2px -2px var(--neon-green); }
            100% { text-shadow: 2px 2px var(--dark-green); }
        }

        .subtitle {
            font-size: 11px; text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 40px; color: #fff; opacity: 0.6;
        }

        .input-group { position: relative; margin-bottom: 30px; }

        .in-auth { 
            width: 100%; background: rgba(0, 20, 0, 0.8); 
            border: 1px solid var(--neon-green); border-radius: 3px; 
            padding: 15px; color: var(--neon-green); text-align: center; 
            outline: none; box-sizing: border-box;
            font-size: 14px; transition: all 0.4s ease;
            text-transform: uppercase;
        }

        .in-auth:focus { 
            background: rgba(0, 40, 0, 0.9);
            box-shadow: 0 0 20px var(--dark-green);
            border-color: #fff;
        }

        .btn-auth { 
            width: 100%; background: transparent; 
            border: 1px solid var(--neon-green); border-radius: 3px; padding: 15px; 
            color: var(--neon-green); font-weight: bold; font-size: 13px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s; 
        }

        .btn-auth:hover { 
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .footer-text {
            margin-top: 30px; font-size: 9px; color: var(--neon-green);
            opacity: 0.4; letter-spacing: 1px;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <canvas id="matrix"></canvas>

    <div class="auth-container">
        <div class="logo-title">NEXUS</div>
        <div class="subtitle">Terminal Access v2.0</div>
        
        <div class="input-group">
            <input type="password" id="keyInput" class="in-auth" placeholder="ENTER ACCESS KEY" autocomplete="off">
        </div>
        
        <button class="btn-auth" id="loginBtn" onclick="autenticar()">Execute Login</button>
        
        <div class="footer-text">© 2026 NEXUS SYSTEMS CORP.</div>
    </div>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                // Variar cores para profundidade
                ctx.fillStyle = Math.random() > 0.9 ? "#fff" : "#00ff41";
                
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 35);

        // Login Logic
        function autenticar() {
            const key = document.getElementById('keyInput').value.trim();
            const btn = document.getElementById('loginBtn');

            if (key === "NEXUS-2026-VIP") {
                btn.innerHTML = "ACCESS GRANTED...";
                btn.style.borderColor = "#fff";
                setTimeout(() => {
                    window.location.href = "sucesso.login.html";
                }, 1000);
            } else {
                alert("CRITICAL ERROR: Invalid Credentials.");
                document.getElementById('keyInput').value = "";
            }
        }

        // Permite apertar Enter para logar
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                autenticar();
            }
        });

        // Bloquear atalhos de desenvolvedor (F12, Ctrl+Shift+I)
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0)))) {
                return false;
            }
        }
    </script>
</body>
</html>
