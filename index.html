<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS XITER VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff00;
            --dark-bg: #000000;
            --panel-bg: rgba(0, 0, 0, 0.95);
            --item-bg: rgba(0, 255, 0, 0.07);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            /* Usa dvh para evitar bugs em navegadores móveis */
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Fica no fundo */
            opacity: 0.4;
            pointer-events: none;
        }

        /* Content Wrapper */
        .main-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 10; /* Fica à frente do canvas */
            position: relative;
        }

        /* Estilo do Painel */
        .nexus-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), inset 0 0 15px rgba(0, 255, 0, 0.1);
            padding: 35px 25px;
            border-radius: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            width: 100%;
        }

        .hidden-panel {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Tipografia */
        .nexus-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 5px;
        }

        .nexus-subtitle {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--neon-green);
            opacity: 0.8;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Inputs */
        .nexus-input {
            background: rgba(0, 0, 0, 1);
            border: 1px solid rgba(0, 255, 0, 0.4);
            color: #fff;
            width: 100%;
            padding: 16px;
            text-align: center;
            font-size: 0.9rem;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .nexus-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        /* Botões */
        .nexus-btn {
            background: var(--neon-green);
            color: #000;
            width: 100%;
            padding: 16px;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.3);
        }

        .nexus-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Menu de Funções */
        .mod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--item-bg);
            margin-bottom: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 0, 0.15);
        }

        .mod-name {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #111; transition: .3s;
            border-radius: 34px; border: 1px solid rgba(0, 255, 0, 0.4);
        }
        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px; left: 2px; bottom: 2px;
            background-color: var(--neon-green); transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        #msg { 
            margin-top: 15px; 
            font-size: 0.7rem; 
            font-weight: 700;
            min-height: 18px;
        }

        .footer-link {
            display: block;
            margin-top: 25px;
            font-size: 0.65rem;
            color: var(--neon-green);
            opacity: 0.5;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="main-container">
        <!-- Secção de Login -->
        <div id="loginSection" class="nexus-panel">
            <h1 class="nexus-title">NEXUS VIP</h1>
            <p class="nexus-subtitle">Verificação de Acesso</p>
            
            <input type="password" id="keyInput" placeholder="COLE A SUA KEY AQUI" autocomplete="off" class="nexus-input">
            
            <button onclick="validaKey()" class="nexus-btn">ENTRAR NO SISTEMA</button>
            
            <p id="msg"></p>
        </div>

        <!-- Secção do Menu -->
        <div id="menuSection" class="nexus-panel hidden-panel">
            <h1 class="nexus-title" style="font-size: 1.3rem;">MENU ATIVO</h1>
            <p class="nexus-subtitle">Elite Scripts Liberados</p>

            <div class="space-y-1">
                <div class="mod-item">
                    <span class="mod-name">AUTO HEADSHOT</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">AIMLOCK (FIXAR)</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">ESP LINE (ANTENA)</span>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">ATRAVESSAR TUDO</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <button onclick="location.reload()" class="footer-link">TERMINAR SESSÃO</button>
        </div>
    </div>

    <script>
        // Matrix Background corrigido
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, drops;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            const columns = Math.floor(width / 20);
            drops = new Array(columns).fill(1);
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.font = '14px monospace';
            for(let i = 0; i < drops.length; i++) {
                const char = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(char, i * 20, drops[i] * 20);
                if (drops[i] * 20 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        
        window.addEventListener('resize', init);
        init();
        setInterval(draw, 50);

        // Lógica de Acesso
        function validaKey() {
            const input = document.getElementById('keyInput').value;
            const msg = document.getElementById('msg');
            const login = document.getElementById('loginSection');
            const menu = document.getElementById('menuSection');

            if (input.trim() === "MATRIX-2024") {
                msg.innerText = "ACESSO CONCEDIDO!";
                msg.style.color = "#00ff00";
                
                setTimeout(() => {
                    login.style.opacity = "0";
                    setTimeout(() => {
                        login.classList.add('hidden-panel');
                        menu.classList.remove('hidden-panel');
                        setTimeout(() => {
                            menu.style.opacity = "1";
                        }, 50);
                    }, 400);
                }, 600);
            } else {
                msg.innerText = "CHAVE INVÁLIDA!";
                msg.style.color = "#ff3333";
                shake(login);
            }
        }

        function shake(el) {
            el.style.transform = 'translateX(-10px)';
            setTimeout(() => el.style.transform = 'translateX(10px)', 100);
            setTimeout(() => el.style.transform = 'translateX(0)', 200);
        }
    </script>
</body>
</html>
