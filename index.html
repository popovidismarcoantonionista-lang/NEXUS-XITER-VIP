<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS VIP LOGIN</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #000;
            color: #0f0; /* Estilo Matrix */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 1px solid #0f0;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 15px #0f0;
        }
        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            outline: none;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #0a0; }
        .status { margin-top: 15px; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>NEXUS VIP</h2>
        <p>INSIRA SUA KEY</p>
        <input type="text" id="input_key" placeholder="CHAVE DE ACESSO">
        <br>
        <button onclick="verificarAcesso()">ENTRAR NO SISTEMA</button>
        <div id="status" class="status">AGUARDANDO...</div>
    </div>

    <script>
        // CONFIGURAÇÕES DO SEU FIREBASE
        // Pegue esses dados no Console do Firebase > Configurações do Projeto > Seus Apps > Web App (ícone </>)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            databaseURL: "SUA_URL_DO_DATABASE_AQUI",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function verificarAcesso() {
            const keyDigitada = document.getElementById("input_key").value;
            const statusDiv = document.getElementById("status");

            if (keyDigitada === "") {
                statusDiv.innerHTML = "ERRO: DIGITE ALGO";
                return;
            }

            statusDiv.innerHTML = "VERIFICANDO...";

            // Consulta o nó 'keys' no seu banco de dados
            // Ele vai procurar por: keys/SUA_KEY
            database.ref('keys/' + keyDigitada).once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        statusDiv.innerHTML = "ACESSO PERMITIDO!";
                        
                        // 1. Avisa o App Android (Sketchware) que o login deu certo
                        if (window.Android && window.Android.loginSucesso) {
                            window.Android.loginSucesso();
                        }

                        // 2. Redireciona para a página do Painel (sucesso)
                        setTimeout(() => {
                            window.location.href = "sucesso.login.html";
                        }, 1000);
                        
                    } else {
                        statusDiv.innerHTML = "ERRO: KEY INVÁLIDA";
                        alert("KEY NÃO ENCONTRADA NO SISTEMA!");
                    }
                })
                .catch((error) => {
                    statusDiv.innerHTML = "ERRO DE CONEXÃO";
                    console.error(error);
                });
        }
    </script>
</body>
</html>
