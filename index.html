<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --green: #00ff41; --blue: #00f7ff; --bg: rgba(0, 0, 0, 0.9); }
        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; color: var(--green); }
        .panel { width: 85%; max-width: 320px; background: var(--bg); border: 1px solid var(--green); border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        #mod-ui { display: none; border-color: var(--blue); box-shadow: 0 0 20px rgba(0,247,255,0.2); }
        .in { width: 100%; background: #111; border: 1px solid var(--green); padding: 12px; color: #fff; margin-bottom: 20px; text-align: center; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-g { background: var(--green); color: #000; }
        .btn-b { background: var(--blue); color: #000; margin-top: 20px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); margin: 5px 0; border-radius: 5px; }
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 20px; transition: .4s; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--blue); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div id="auth-ui" class="panel">
        <h2 style="text-shadow: 0 0 10px var(--green)">NEXUS VIP</h2>
        <input type="text" id="keyInput" class="in" placeholder="DIGITE A KEY">
        <button class="btn btn-g" onclick="logar()">ENTRAR</button>
    </div>

    <div id="mod-ui" class="panel">
        <h2 style="color: var(--blue); text-shadow: 0 0 10px var(--blue)">DUMP MENU</h2>
        <div class="item"><span>AimLock</span><label class="switch"><input type="checkbox" onclick="patch('Aim', '0x336371c', '0000A0E3')"><span class="slider"></span></label></div>
        <div class="item"><span>Speed</span><label class="switch"><input type="checkbox" onclick="patch('Speed', '0x68a10dc', '0000A0E3')"><span class="slider"></span></label></div>
        <div class="item"><span>FOV</span><label class="switch"><input type="checkbox" onclick="patch('FOV', '0x3357530', '0000A0E3')"><span class="slider"></span></label></div>
        <button class="btn btn-b" onclick="abrir()">INICIAR JOGO</button>
    </div>

    <script>
        // MATRIX EFFECT
        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.height = window.innerHeight; c.width = window.innerWidth;
        const drops = Array(Math.floor(c.width/14)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = '#0f0';
            drops.forEach((y, i) => {
                ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
                if (y*14 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        // LOGICA
        function logar() {
            const k = document.getElementById('keyInput').value.trim().toUpperCase();
            if(k === "NEXUS") {
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('mod-ui').style.display = 'block';
            } else { alert("KEY INCORRETA!"); }
        }

        function patch(n, o, h) { if(typeof Android !== 'undefined') Android.applyPatch(n, o, h); }
        function abrir() { if(typeof Android !== 'undefined') Android.abrirJogo(); }
    </script>
</body>
</html>
