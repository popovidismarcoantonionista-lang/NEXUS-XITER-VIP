<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS XITER VIP</title>
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0a; --shadow: rgba(0, 255, 65, 0.2); }
        
        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--neon);
            margin-bottom: 15px;
            padding-bottom: 5px;
            text-shadow: 0 0 10px var(--neon);
        }

        .category {
            border: 1px solid var(--neon);
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: inset 0 0 5px var(--shadow);
        }

        .category-title {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            background: var(--neon);
            color: black;
            padding: 2px 5px;
            width: fit-content;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        /* Switch Customizado Matrix */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222;
            border: 1px solid var(--neon);
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px; width: 12px;
            left: 2px; bottom: 2px;
            background-color: var(--neon);
            transition: .4s;
        }

        input:checked + .slider { background-color: var(--shadow); }
        input:checked + .slider:before { transform: translateX(16px); box-shadow: 0 0 8px var(--neon); }

        .footer {
            font-size: 0.6em;
            text-align: center;
            margin-top: 10px;
            opacity: 0.7;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            opacity: 0.15;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="header">
    <div style="font-size: 1.2em; font-weight: bold;">NEXUS XITER VIP</div>
    <div style="font-size: 0.7em;">USER: ADMIN | EXPIRES: 2026-12-31</div>
</div>

<div class="category">
    <span class="category-title">Combate Assist</span>
    <div class="menu-item">
        <span>Aimbot 360°</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('aim', '0x5ff5a84', '200080D2C0035FD6', this)"><span class="slider"></span></label>
    </div>
    <div class="menu-item">
        <span>No Recoil</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('recoil', '0x51da704', '00000000', this)"><span class="slider"></span></label>
    </div>
</div>

<div class="category">
    <span class="category-title">Movement Hack</span>
    <div class="menu-item">
        <span>Fly Hack (Voo)</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('fly', '0x5ff5a3c', '00000000', this)"><span class="slider"></span></label>
    </div>
    <div class="menu-item">
        <span>Speed Flash</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('speed', '0x5ff5a1c', '0000C842', this)"><span class="slider"></span></label>
    </div>
</div>

<div class="category">
    <span class="category-title">Visual & Interface</span>
    <div class="menu-item">
        <span>Antena 100%</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('esp', '0x51d7294', 'C0035FD6', this)"><span class="slider"></span></label>
    </div>
    <div class="menu-item">
        <span>Grão-Mestre Fake</span>
        <label class="switch"><input type="checkbox" onchange="toggleHack('rank', '0x51d765c', '200080D2C0035FD6', this)"><span class="slider"></span></label>
    </div>
</div>

<div class="footer">NEXUS SYSTEM V3.1 - ENCRYPTED CONNECTION</div>

<script>
    // Lógica Matrix Background
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 10;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0";
        ctx.font = fontSize + "px arial";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // Ponte com o Android (Sketchware)
    function toggleHack(tag, offset, patch, element) {
        if (element.checked) {
            // Se estiver usando Sketchware, chama a Interface JS
            if (window.Android) {
                window.Android.applyPatch(offset, patch);
            }
            console.log("Ativado: " + tag + " no offset " + offset);
        } else {
            if (window.Android) {
                window.Android.removePatch(offset);
            }
            console.log("Desativado: " + tag);
        }
    }
</script>
</body>
</html>
