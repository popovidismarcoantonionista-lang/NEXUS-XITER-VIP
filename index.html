<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: transparent; color: #00ff00; font-family: monospace; text-align: center; }
        .panel { background: rgba(0,0,0,0.9); border: 2px solid #0f0; border-radius: 20px; padding: 20px; width: 300px; margin: auto; box-shadow: 0 0 20px #0f0; }
        .item { display: flex; justify-content: space-between; margin: 15px 0; padding: 10px; border: 1px solid #0f03; }
        button { background: #0f0; color: #000; border: none; padding: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #111; border: 1px solid #0f0; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 2px; background: #0f0; transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(18px); background: #fff; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>NEXUS VIP ARM64</h3>
        
        <div class="item">
            <span>ANTENA ESP</span>
            <label class="switch">
                <input type="checkbox" onchange="Android.applyPatch('Antena', '0x68a1144', '1F2003D5')">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mod-item">
            <span>SPEED HACK</span>
            <label class="switch">
                <input type="checkbox" onchange="Android.applyPatch('Speed', '0x68a10dc', '200080D2')">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mod-item">
            <span>AIM ASSIST</span>
            <label class="switch">
                <input type="checkbox" onchange="Android.applyPatch('Aim', '0x7393994', '200080D2')">
                <span class="slider"></span>
            </label>
        </div>

        <button onclick="Android.abrirJogo()">ABRIR JOGO</button>
    </div>
</body>
</html>
