<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS VIP OB53</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f7ff;
            --bg-dark: rgba(0, 0, 0, 0.92);
        }

        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        
        body { 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; color: var(--neon-green); 
        }

        .panel {
            width: 85%; max-width: 340px; 
            background: var(--bg-dark);
            border-radius: 15px; padding: 30px 20px; 
            text-align: center; position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
        }

        /* Bordas Neon Dinâmicas */
        #auth-ui { border: 1px solid var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
        #mod-ui { border: 1px solid var(--neon-blue); box-shadow: 0 0 25px rgba(0, 247, 255, 0.2); display: none; }

        .title-g { font-size: 28px; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 10px var(--neon-green); margin-bottom: 30px; }
        .title-c { font-size: 22px; letter-spacing: 2px; font-weight: 800; color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); margin-bottom: 20px; }

        .cat { 
            color: var(--neon-blue); font-size: 11px; text-align: left; 
            margin: 20px 0 10px; padding-left: 10px; 
            border-left: 3px solid var(--neon-blue); 
            text-transform: uppercase; font-weight: bold; letter-spacing: 1px;
        }

        .in { 
            width: 100%; background: rgba(0, 40, 0, 0.3); 
            border: 1px solid var(--neon-green); border-radius: 5px; 
            padding: 15px; color: #fff; text-align: center; 
            outline: none; margin-bottom: 25px; box-sizing: border-box;
            font-size: 16px; transition: 0.3s;
        }
        .in:focus { box-shadow: 0 0 15px var(--neon-green); background: rgba(0, 60, 0, 0.5); }
        
        .btn-g { 
            width: 100%; background: linear-gradient(45deg, #008f11, var(--neon-green)); 
            border: none; border-radius: 5px; padding: 15px; 
            color: #000; font-weight: bold; font-size: 14px;
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .btn-g:active { transform: scale(0.98); opacity: 0.8; }

        .btn-c { 
            width: 100%; background: linear-gradient(45deg, #00a2ff, var(--neon-blue)); 
            border: none; border-radius: 5px; padding: 15px; 
            color: #000; font-weight: bold; margin-top: 25px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0, 247, 255, 0.3);
        }

        .item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 10px; background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px; border-radius: 8px;
        }
        .name { color: #e0e0e0; font-size: 14px; font-weight: 500; }

        /* Switches Estilizados */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background: #222; transition: .4s; border-radius: 34px; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 16px; width: 16px; 
            left: 4px; bottom: 3px; background: #555; transition: .4s; border-radius: 50%; 
        }
        input:checked + .slider { background: rgba(0, 247, 255, 0.2); }
        input:checked + .slider:before { transform: translateX(20px); background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div id="auth-ui" class="panel">
        <h1 class="title-g">NEXUS VIP</h1>
        <input type="text" id="keyInput" class="in" placeholder="ENTER ACCESS KEY">
        <button class="btn-g" onclick="fazerLogin()">AUTHENTICATE</button>
    </div>

    <div id="mod-ui" class="panel">
        <h1 class="title-c">DUMP MENU OB53</h1>
        
        <div class="cat">Combat Functions</div>
        <div class="item">
            <span class="name">AimLock Camera</span>
            <label class="switch">
                <input type="checkbox" onclick="sendPatch('AimLock', '0x336371c', '0000A0E3')">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cat">Movement Mods</div>
        <div class="item">
            <span class="name">Speed Multiplier</span>
            <label class="switch">
                <input type="checkbox" onclick="sendPatch('SpeedMove', '0x68a10dc', '0000A0E3')">
                <span class="slider"></span>
            </label>
        </div>
        <div class="item">
            <span class="name">Fast SkyDive</span>
            <label class="switch">
                <input type="checkbox" onclick="sendPatch('FlySky', '0x6ef16e8', '0000A0E3')">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cat">Visual Settings</div>
        <div class="item">
            <span class="name">Custom FOV</span>
            <label class="switch">
                <input type="checkbox" onclick="sendPatch('FOV', '0x3357530', '0000A0E3')">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-c" onclick="abrirOJogo()">LAUNCH GAME</button>
    </div>

    <script>
        // Matrix Background Animation
        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.height = window.innerHeight; c.width = window.innerWidth;
        const char = "01".split('');
        const fontSize = 14, columns = c.width / fontSize, drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = '#003300'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = char[Math.floor(Math.random() * char.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 40);

        function fazerLogin() {
            var digitado = document.getElementById('keyInput').value.trim().toUpperCase();
            if (digitado === "NEXUS") {
                document.getElementById('auth-ui').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-ui').style.display = 'none';
                    document.getElementById('mod-ui').style.display = 'block';
                }, 500);
            } else {
                alert("ACCESS DENIED: Invalid Key");
            }
        }

        function sendPatch(name, offset, hex) {
            if (typeof Android !== "undefined") Android.applyPatch(name, offset, hex);
        }

        function abrirOJogo() {
            if (typeof Android !== "undefined") Android.abrirJogo();
        }
    </script>
</body>
</html>
