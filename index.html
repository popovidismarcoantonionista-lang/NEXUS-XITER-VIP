<body>

    <canvas id="matrix-canvas"></canvas>

    <!-- Painel de Login (Baseado na imagem) -->
    <div id="loginSection" class="nexus-panel">
        <h1 class="nexus-title">NEXUS XITER VIP</h1>
        <p class="nexus-subtitle text-green-500">SISTEMA DE AUTENTICAÇÃO</p>
        
        <input type="password" id="keyInput" placeholder="COLE SUA KEY" autocomplete="off" class="nexus-input">
        
        <button onclick="validaKey()" class="nexus-btn">LOGAR NO MOD</button>
        
        <p id="msg"></p>
    </div>

    <!-- Mod Menu (Aparece após a Key) -->
    <div id="menuSection" class="nexus-panel hidden-panel">
        <h1 class="nexus-title" style="font-size: 1.4rem;">MENU ATIVO</h1>
        <p class="nexus-subtitle mb-4">FUNÇÕES DISPONÍVEIS</p>

        <div class="space-y-2 text-left">
            <div class="mod-item">
                <span class="text-xs font-bold">AUTO HEADSHOT</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="mod-item">
                <span class="text-xs font-bold">AIMLOCK</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="mod-item">
                <span class="text-xs font-bold">ESP LINE (ANTENA)</span>
                <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="mod-item">
                <span class="text-xs font-bold">WALLHACK</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
        </div>

        <button onclick="location.reload()" class="nexus-btn mt-6" style="background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); font-size: 0.7rem; padding: 10px;">
            SAIR DO SISTEMA
        </button>
    </div>

    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, drops;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            drops = new Array(Math.floor(width / 18)).fill(1);
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#0F0';
            ctx.font = '15px monospace';
            drops.forEach((y, i) => {
                const char = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(char, i * 18, y * 18);
                if (y * 18 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        window.addEventListener('resize', init);
        init();
        setInterval(draw, 50);

        // Lógica de Autenticação
        function validaKey() {
            const input = document.getElementById('keyInput').value;
            const msg = document.getElementById('msg');
            const login = document.getElementById('loginSection');
            const menu = document.getElementById('menuSection');

            // CHAVE DE ACESSO
            if (input === "MATRIX-2024") {
                msg.innerText = "AUTENTICADO COM SUCESSO!";
                msg.style.color = "#00ff00";
                
                setTimeout(() => {
                    login.classList.add('hidden-panel');
                    menu.classList.remove('hidden-panel');
                }, 800);
            } else {
                msg.innerText = "KEY INVÁLIDA OU EXPIRADA!";
                msg.style.color = "#ff0000";
                shake(login);
            }
        }

        function shake(el) {
            el.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-10px)' },
                { transform: 'translateX(10px)' },
                { transform: 'translateX(0)' }
            ], { duration: 150, iterations: 2 });
        }
    </script>
</body>
