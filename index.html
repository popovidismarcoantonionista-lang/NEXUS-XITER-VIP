<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS XITER VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #00ff00; --bg: #000; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: monospace; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; }
        .nexus-panel { background: rgba(0, 0, 0, 0.9); border: 2px solid var(--neon); box-shadow: 0 0 20px var(--neon); padding: 2rem; border-radius: 20px; width: 320px; text-align: center; z-index: 100; }
        .mod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0, 255, 0, 0.05); margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(0, 255, 0, 0.2); }
        .hidden { display: none; }
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; transition: .4s; border-radius: 20px; border: 1px solid var(--neon); }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: var(--neon); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon); }
        input:checked + .slider:before { transform: translateX(16px); background-color: #000; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="login" class="nexus-panel">
        <h1 style="font-size: 1.5rem; letter-spacing: 3px; margin-bottom: 20px;">NEXUS LOGIN</h1>
        <input type="password" id="key" placeholder="KEY" style="background:#000; border:1px solid #0f0; color:#fff; width:100%; padding:10px; text-align:center; margin-bottom:15px;">
        <button onclick="auth()" style="background:#0f0; color:#000; width:100%; padding:10px; font-weight:bold; cursor:pointer;">LOGAR</button>
    </div>

    <div id="painel" class="nexus-panel hidden">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;">MENU ATIVO</h2>
        
        <div class="mod-item">
            <span style="font-size: 12px;">AUTO HEADSHOT</span>
            <label class="switch"><input type="checkbox" onchange="cmd('headshot', this.checked)"><span class="slider"></span></label>
        </div>

        <div class="mod-item">
            <span style="font-size: 12px;">AIM SILENT</span>
            <label class="switch"><input type="checkbox" onchange="cmd('aimsilent', this.checked)"><span class="slider"></span></label>
        </div>

        <div class="mod-item" style="flex-direction: column; gap: 5px;">
            <span style="font-size: 10px;">TAXA HS: <span id="val">50</span>%</span>
            <input type="range" min="1" max="100" value="50" style="width: 100%; accent-color: #0f0;" oninput="updateHs(this.value)">
        </div>

        <button onclick="location.reload()" style="margin-top:15px; color:red; background:none; border:none; font-size:10px; cursor:pointer;">SAIR</button>
    </div>

    <script>
        function auth() {
            if(document.getElementById('key').value === "MATRIX-2024") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('painel').classList.remove('hidden');
            }
        }

        function cmd(hack, status) {
            if(window.Android) { window.Android.fazerAcao(hack, status); }
        }

        function updateHs(v) {
            document.getElementById('val').innerText = v;
            if(window.Android) { window.Android.setHsRate(parseInt(v)); }
        }

        // Matrix Effect
        const c = document.getElementById('matrix-canvas');
        const ctx = c.getContext('2d');
        let w = c.width = window.innerWidth;
        let h = c.height = window.innerHeight;
        let d = new Array(Math.floor(w/18)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#0F0'; ctx.font = '15px monospace';
            d.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(0x30A0 + Math.random()*96), i*18, y*18);
                if(y*18 > h && Math.random() > 0.975) d[i] = 0; d[i]++;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
