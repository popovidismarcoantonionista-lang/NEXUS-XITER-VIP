<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS VIP</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .panel { 
            width: 90%; max-width: 320px; background: rgba(0, 0, 0, 0.9); 
            border: 2px solid #0f0; border-radius: 20px; padding: 25px; 
            text-align: center; box-shadow: 0 0 20px #0f0; box-sizing: border-box;
        }
        .title { color: #0f0; font-size: 26px; text-shadow: 0 0 10px #0f0; margin-bottom: 5px; }
        .subtitle { color: #0f0; font-size: 10px; letter-spacing: 2px; opacity: 0.7; margin-bottom: 25px; }
        .key-input { 
            width: 100%; background: rgba(0, 30, 0, 0.5); border: 1px solid #0f0; 
            border-radius: 8px; padding: 12px; color: #0f0; outline: none; 
            margin-bottom: 20px; box-sizing: border-box; text-align: center;
        }
        .btn { 
            width: 100%; background: #0f0; border: none; border-radius: 8px; 
            padding: 12px; color: #000; font-weight: bold; cursor: pointer; 
            box-shadow: 0 0 10px #0f0; text-transform: uppercase;
        }
        .hack-item { display: flex; justify-content: space-between; align-items: center; color: #0f0; margin: 15px 0; border-bottom: 1px solid rgba(0, 255, 0, 0.2); padding-bottom: 5px; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>

    <div id="login-ui" class="panel">
        <h1 class="title">NEXUS VIP</h1>
        <p class="subtitle">SISTEMA DE AUTENTICAÇÃO</p>
        <input type="text" id="key" class="key-input" placeholder="COLE SUA KEY AQUI">
        <button class="btn" onclick="auth()">LOGAR NO MOD</button>
    </div>

    <div id="mod-ui" class="panel" style="display: none; border-color: #0ff; box-shadow: 0 0 20px #0ff;">
        <h1 class="title" style="color: #0ff; text-shadow: 0 0 10px #0ff;">FUNÇÕES OB53</h1>
        
        <div class="hack-item">
            <span>AIMBOT 100%</span>
            <input type="checkbox" onclick="try{Android.applyPatch('AIMBOT', '0x2B4A1C', '0000A0E3')}catch(e){console.log(e)}">
        </div>
        <div class="hack-item">
            <span>ANTENA HEAD</span>
            <input type="checkbox" onclick="try{Android.applyPatch('ANTENA', '0x1A2B3C', '0100A0E3')}catch(e){console.log(e)}">
        </div>

        <button class="btn" style="background:#0ff; box-shadow: 0 0 10px #0ff; margin-top:20px;" onclick="try{Android.abrirJogo()}catch(e){alert('Abrindo Jogo...')}">ABRIR FREE FIRE</button>
    </div>

    <script>
        // Fundo Matrix
        const c = document.getElementById('m'), q = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const s = Array(256).fill(0);
        function d() {
            q.fillStyle = 'rgba(0,0,0,.05)'; q.fillRect(0,0,c.width,c.height);
            q.fillStyle = '#0F0';
            s.forEach((y, i) => {
                q.fillText(String.fromCharCode(33+Math.random()*94), i*10, y);
                s[i] = y > 758 + Math.random()*1e4 ? 0 : y + 10;
            });
        }
        setInterval(d, 33);

        // FUNÇÃO DE LOGIN CORRIGIDA
        function auth() {
            const input = document.getElementById('key').value.trim();
            const login = document.getElementById('login-ui');
            const mod = document.getElementById('mod-ui');

            // Verifica se a Key é NEXUS (Maiúsculas)
            if(input === "NEXUS") {
                login.style.display = 'none';
                mod.style.display = 'block';
            } else {
                alert("KEY INCORRETA!");
            }
        }
    </script>
</body>
</html>
