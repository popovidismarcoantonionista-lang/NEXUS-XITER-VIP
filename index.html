<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS LOGIN</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #0f0; padding: 30px; border-radius: 15px; box-shadow: 0 0 15px #0f0; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 80%; text-align: center; margin-top: 15px; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; margin-top: 20px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="box">
        <h2>NEXUS XITER VIP</h2>
        <input type="text" id="keyInput" placeholder="DIGITE A KEY">
        <button onclick="check()">ENTRAR</button>
    </div>

    <script>
        function check() {
            const k = document.getElementById('keyInput').value.trim();
            // Aqui você define a key que quiser
            if (k === "NEXUS-2026-VIP") {
                window.location.href = "sucesso.login.html";
            } else {
                alert("KEY INVÁLIDA!");
            }
        }
    </script>
</body>
</html>
