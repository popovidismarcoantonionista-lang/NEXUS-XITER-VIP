<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS XITER VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff00;
            --dark-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Fira Code', monospace;
        }

        /* Container Principal: Centralização Absoluta */
        .viewport-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh; /* Dynamic Viewport Height para mobile */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none; /* Permite clicar no que está atrás se necessário */
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.6;
        }

        /* Painel Estilo Imagem */
        .nexus-panel {
            pointer-events: auto; /* Reativa cliques dentro do painel */
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 10px var(--neon-green);
            padding: 40px 25px;
            border-radius: 30px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .hidden { display: none; }

        .nexus-title {
            color: var(--neon-green);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 8px;
        }

        .nexus-subtitle {
            color: var(--neon-green);
            font-size: 0.65rem;
            letter-spacing: 2px;
            opacity: 0.8;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Inputs Estilizados */
        .input-box {
            background: #000;
            border: 1px solid var(--neon-green);
            color: #fff;
            width: 100%;
            padding: 14px;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 20px;
            outline: none;
            border-radius: 4px;
        }

        .input-box::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        /* Botão Logar Verde Vibrante */
        .btn-logar {
            background: #00ff00;
            color: #000;
            width: 100%;
            padding: 14px;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px #00ff00;
            transition: 0.2s;
            border-radius: 4px;
        }

        .btn-logar:active {
            transform: scale(0.95);
            background: #fff;
            box-shadow: 0 0 20px #fff;
        }

        /* Menu de Funções */
        .mod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(0, 255, 0, 0.05);
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        .mod-name { font-size: 0.7rem; font-weight: 700; }

        /* Switch Custom */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #111; transition: .3s;
            border-radius: 20px; border: 1px solid var(--neon-green);
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px; left: 2px; bottom: 2px;
            background-color: var(--neon-green); transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(18px); background-color: #000; }

        #msg { 
            margin-top: 15px; 
            font-size: 0.7rem; 
            font-weight: bold; 
            min-height: 1.2em;
        }

        .error-text { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        .success-text { color: var(--neon-green); }

    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="viewport-wrapper">
        
        <!-- Login Section -->
        <div id="loginSection" class="nexus-panel">
            <h1 class="nexus-title">NEXUS VIP</h1>
            <p class="nexus-subtitle">Sistema de Autenticação</p>
            
            <input type="password" id="keyInput" placeholder="COLE SUA KEY AQUI" autocomplete="off" class="input-box">
            
            <button onclick="validaKey()" class="btn-logar">LOGAR NO MOD</button>
            
            <p id="msg"></p>
        </div>

        <!-- Menu Section (Inicia Oculto) -->
        <div id="menuSection" class="nexus-panel hidden">
            <h1 class="nexus-title" style="font-size: 1.2rem;">MENU ATIVO</h1>
            <p class="nexus-subtitle" style="margin-bottom: 20px;">FUNÇÕES LIBERADAS</p>

            <div class="mod-item">
                <span class="mod-name">AUTO HEADSHOT</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="mod-item">
                <span class="mod-name">AIMLOCK</span>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="mod-item">
                <span class="mod-name">ESP LINE</span>
                <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            
            <button onclick="location.reload()" class="btn-logar" style="background: transparent; border: 1px solid #00ff00; color: #00ff00; margin-top: 15px; font-size: 0.7rem; box-shadow: none;">SAIR</button>
        </div>

    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns, drops;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / 20);
            drops = new Array(columns).fill(1);
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#0F0';
            ctx.font = '15px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * 20, drops[i] * 20);
                if (drops[i] * 20 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        window.addEventListener('resize', resize);
        resize();
        setInterval(draw, 50);

        // Lógica de Autenticação
        function validaKey() {
            const input = document.getElementById('keyInput').value;
            const msg = document.getElementById('msg');
            const login = document.getElementById('loginSection');
            const menu = document.getElementById('menuSection');

            if (input === "MATRIX-2024") {
                msg.className = "success-text";
                msg.innerText = "ACESSO CONCEDIDO!";
                setTimeout(() => {
                    login.classList.add('hidden');
                    menu.classList.remove('hidden');
                }, 800);
            } else {
                msg.className = "error-text";
                msg.innerText = "ERRO: KEY INVÁLIDA";
                shake(login);
            }
        }

        function shake(el) {
            el.style.transform = 'translateX(-10px)';
            setTimeout(() => el.style.transform = 'translateX(10px)', 80);
            setTimeout(() => el.style.transform = 'translateX(-10px)', 160);
            setTimeout(() => el.style.transform = 'translateX(0)', 240);
        }
    </script>
</body>
</html>
