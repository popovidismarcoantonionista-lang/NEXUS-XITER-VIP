<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS VIP LOGIN</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 1px solid #0f0;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px #0f0;
            border-radius: 10px;
        }
        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px;
            margin: 15px 0;
            width: 85%;
            outline: none;
            text-align: center;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-transform: uppercase;
        }
        button:hover { background: #0a0; }
        .status { margin-top: 15px; font-size: 0.9em; color: #fff; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="margin-bottom: 5px;">NEXUS VIP</h2>
        <p style="font-size: 0.8em;">SISTEMA DE VERIFICAÇÃO</p>
        <input type="text" id="input_key" placeholder="DIGITE SUA KEY">
        <br>
        <button onclick="verificarAcesso()">VERIFICAR CHAVE</button>
        <div id="status" class="status">AGUARDANDO LOGIN...</div>
    </div>

    <script>
        // CONFIGURAÇÕES EXTRAÍDAS DO SEU JSON
        const firebaseConfig = {
            apiKey: "AIzaSyA0Q2b-zUJRT7VBrsKRdsln7UR9hLy_YKY",
            authDomain: "alphagen-p9d3i.firebaseapp.com",
            databaseURL: "https://alphagen-p9d3i-default-rtdb.firebaseio.com/",
            projectId: "alphagen-p9d3i",
            storageBucket: "alphagen-p9d3i.firebasestorage.app",
            messagingSenderId: "391202812925",
            appId: "1:391202812925:android:f4498042d3c1db3c99df94"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function verificarAcesso() {
            const keyDigitada = document.getElementById("input_key").value;
            const statusDiv = document.getElementById("status");

            if (keyDigitada === "") {
                statusDiv.innerHTML = "ERRO: CAMPO VAZIO";
                return;
            }

            statusDiv.innerHTML = "VALIDANDO NO BANCO...";

            // Consulta no nó 'keys' do seu Realtime Database
            database.ref('keys/' + keyDigitada).once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        statusDiv.innerHTML = "KEY VÁLIDA! REDIRECIONANDO...";
                        
                        // Avisa o Android (Sketchware) para mostrar o Toast
                        if (window.Android && window.Android.loginSucesso) {
                            window.Android.loginSucesso();
                        }

                        // Redireciona para o seu painel de sucesso no GitHub
                        setTimeout(() => {
                            window.location.href = "sucesso.login.html";
                        }, 1200);
                        
                    } else {
                        statusDiv.innerHTML = "<span style='color:red;'>KEY INVÁLIDA</span>";
                        alert("ESSA KEY NÃO EXISTE!");
                    }
                })
                .catch((error) => {
                    statusDiv.innerHTML = "ERRO DE CONEXÃO";
                    console.error(error);
                    alert("Verifique a conexão ou as Regras do Database!");
                });
        }
    </script>
</body>
</html>
