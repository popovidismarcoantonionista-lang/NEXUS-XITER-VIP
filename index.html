<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="main-container">
        <!-- Painel de Login -->
        <div id="loginSection" class="nexus-panel">
            <h1 class="nexus-title">NEXUS VIP</h1>
            <p class="nexus-subtitle">Sistema de Autenticação</p>
            
            <div class="nexus-input-group">
                <input type="password" id="keyInput" placeholder="COLE SUA KEY AQUI" autocomplete="off" class="nexus-input">
            </div>
            
            <button onclick="validaKey()" class="nexus-btn">LOGAR NO MOD</button>
            
            <p id="msg"></p>
        </div>

        <!-- Mod Menu -->
        <div id="menuSection" class="nexus-panel hidden-panel">
            <h1 class="nexus-title" style="font-size: 1.4rem;">PAINEL ATIVO</h1>
            <p class="nexus-subtitle">Funções Elite Liberadas</p>

            <div class="menu-items-container">
                <div class="mod-item">
                    <span class="mod-name">AUTO HEADSHOT</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">AIMLOCK</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">ESP LINE (ANTENA)</span>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>
                <div class="mod-item">
                    <span class="mod-name">WALLHACK (V2)</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <button onclick="location.reload()" class="footer-link">ENCERRAR SESSÃO SEGURA</button>
        </div>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, drops;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            drops = new Array(Math.floor(width / 20)).fill(1);
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.font = '14px monospace';
            drops.forEach((y, i) => {
                const char = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(char, i * 20, y * 20);
                if (y * 20 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        window.addEventListener('resize', init);
        init();
        setInterval(draw, 50);

        // Lógica
        function validaKey() {
            const input = document.getElementById('keyInput').value;
            const msg = document.getElementById('msg');
            const login = document.getElementById('loginSection');
            const menu = document.getElementById('menuSection');

            if (input.trim() === "MATRIX-2024") {
                msg.innerText = "ACESSO CONCEDIDO...";
                msg.style.color = "var(--neon-green)";
                
                setTimeout(() => {
                    login.style.opacity = "0";
                    login.style.transform = "scale(0.9) translateY(20px)";
                    
                    setTimeout(() => {
                        login.style.display = "none";
                        menu.style.display = "block";
                        // Forçar reflow para animação
                        void menu.offsetWidth;
                        menu.style.opacity = "1";
                        menu.style.transform = "scale(1) translateY(0)";
                    }, 500);
                }, 800);
            } else {
                msg.innerText = "ERRO: KEY INVÁLIDA";
                msg.style.color = "#ff3333";
                shake(login);
            }
        }

        function shake(el) {
            el.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-8px)' },
                { transform: 'translateX(8px)' },
                { transform: 'translateX(0)' }
            ], { duration: 150, iterations: 2 });
        }
    </script>
</body>
</html>
