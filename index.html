<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; overflow: hidden; color: #0f0; }
        .panel { width: 90%; max-width: 320px; background: rgba(0,0,0,0.9); border-radius: 20px; padding: 25px; text-align: center; box-sizing: border-box; }
        #auth-ui { border: 2px solid #0f0; box-shadow: 0 0 15px #0f0; }
        #mod-ui { border: 2px solid #0ff; box-shadow: 0 0 20px #0ff; display: none; }
        .title-g { font-size: 24px; text-shadow: 0 0 10px #0f0; margin-bottom: 20px; }
        .title-c { font-size: 24px; text-shadow: 0 0 15px #0ff; color: #0ff; margin-bottom: 20px; }
        .in { width: 100%; background: rgba(0,20,0,0.5); border: 1px solid #0f0; border-radius: 8px; padding: 12px; color: #0f0; text-align: center; margin-bottom: 20px; outline: none; }
        .btn-g { width: 100%; background: #0f0; border: none; border-radius: 8px; padding: 12px; font-weight: bold; box-shadow: 0 0 10px #0f0; cursor: pointer; }
        .btn-c { width: 100%; background: #0ff; border: none; border-radius: 8px; padding: 14px; font-weight: bold; box-shadow: 0 0 20px #0ff; margin-top: 15px; cursor: pointer; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,255,255,0.1); }
        .switch { position: relative; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #0ff; }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="auth-ui" class="panel">
        <h1 class="title-g">NEXUS VIP</h1>
        <input type="text" id="pass" class="in" placeholder="DIGITE SUA KEY">
        <button class="btn-g" onclick="doLogin()">LOGAR</button>
    </div>
    <div id="mod-ui" class="panel">
        <h1 class="title-c">MOD MENU OB53</h1>
        <div class="item"><span>AIMBOT 100%</span><label class="switch"><input type="checkbox" onclick="Android.applyPatch('AIM', '0x2B4A1C', '0000A0E3')"><span class="slider"></span></label></div>
        <div class="item"><span>ANTENA HEAD</span><label class="switch"><input type="checkbox" onclick="Android.applyPatch('ANTENA', '0x1A2B3C', '0100A0E3')"><span class="slider"></span></label></div>
        <button class="btn-c" onclick="Android.abrirJogo()">ABRIR JOGO</button>
    </div>
    <script>
        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.height = window.innerHeight; c.width = window.innerWidth;
        const s = Array(256).fill(0);
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = '#0f0'; ctx.font = '14px monospace';
            s.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(33+Math.random()*94), i*10, y);
                s[i] = y > 758 + Math.random()*1e4 ? 0 : y + 10;
            });
        }
        setInterval(draw, 35);
        function doLogin() {
            if(document.getElementById('pass').value.toUpperCase() === "NEXUS") {
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('mod-ui').style.display = 'block';
            } else { alert("KEY INVALIDA!"); }
        }
    </script>
</body>
</html>
