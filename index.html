<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS VIP</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        
        .container {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1f1f1f;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { font-size: 2em; letter-spacing: 4px; margin-bottom: 10px; color: #fff; text-shadow: 0 0 10px #333; }
        p { color: #666; font-size: 0.9em; margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }

        input:focus { border-color: #555; outline: none; background: #151515; }

        button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover { background: #ccc; transform: translateY(-2px); }
        .status { margin-top: 20px; font-size: 0.8em; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>NEXUS</h2>
    <p>DIGITE SUA CHAVE DE ACESSO</p>
    
    <input type="text" id="input_key" placeholder="••••••••••••">
    <button onclick="verificar()">ENTRAR</button>
    
    <div id="status" class="status">AGUARDANDO...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA0Q2b-zUJRT7VBrsKRdsln7UR9hLy_YKY",
        databaseURL: "https://alphagen-p9d3i-default-rtdb.firebaseio.com", // Link corrigido
        projectId: "alphagen-p9d3i",
        appId: "1:391202812925:android:f4498042d3c1db3c99df94"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function verificar() {
        const key = document.getElementById("input_key").value;
        const status = document.getElementById("status");

        if(!key) return alert("Digite a Key!");

        status.innerText = "VALIDANDO...";

        database.ref('keys/' + key).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                status.innerText = "SUCESSO!";
                if(window.Android) window.Android.loginSucesso();
                setTimeout(() => { window.location.href = "sucesso.login.html"; }, 1000);
            } else {
                status.innerText = "KEY INVÁLIDA";
                alert("Key não encontrada!");
            }
        }).catch((e) => {
            alert("Erro!");
            console.log(e);
        });
    }
</script>

</body>
</html>
