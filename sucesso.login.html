<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS VIP - PANEL</title>
    <style>
        :root { 
            --blue: #00f7ff; 
            --green: #00ff41; 
            --bg-dark: rgba(0, 10, 0, 0.9);
        }

        canvas#matrix { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; 
        }

        body { 
            background: black; color: white; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 20px; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; max-width: 320px; 
            border: 1px solid var(--blue); 
            border-radius: 5px; padding: 25px; 
            background: var(--bg-dark); 
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        h3 { 
            color: var(--blue); text-align: center; margin-top: 0; 
            text-shadow: 0 0 10px var(--blue); 
            letter-spacing: 3px; font-size: 22px;
        }

        .user-info {
            font-size: 10px; text-align: center; color: var(--green);
            margin-bottom: 20px; opacity: 0.8; text-transform: uppercase;
        }

        .cat { 
            color: var(--blue); font-size: 11px; 
            border-bottom: 1px solid rgba(0, 247, 255, 0.3); 
            margin: 15px 0 12px; padding-bottom: 3px;
            text-transform: uppercase; font-weight: bold;
        }

        .opt { 
            display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 15px; 
        }

        .opt span { font-size: 13px; color: #fff; text-shadow: 1px 1px 2px #000; }
        
        /* Custom Switch */
        input[type="checkbox"] { 
            width: 45px; height: 22px; appearance: none; 
            background: #111; border: 1px solid #333;
            border-radius: 4px; position: relative; cursor: pointer; transition: 0.3s; 
        }

        input[type="checkbox"]:checked { 
            background: rgba(0, 247, 255, 0.2); 
            border-color: var(--blue);
            box-shadow: 0 0 10px var(--blue);
        }

        input[type="checkbox"]::before { 
            content: ''; position: absolute; width: 14px; height: 14px; 
            background: #444; border-radius: 2px; top: 3px; left: 4px; transition: 0.3s; 
        }

        input[type="checkbox"]:checked::before { 
            left: 25px; background: var(--blue); 
            box-shadow: 0 0 5px var(--blue);
        }

        .btn-game { 
            background: transparent; color: var(--blue); 
            border: 1px solid var(--blue); width: 100%; 
            padding: 14px; font-weight: bold; border-radius: 4px; 
            margin-top: 25px; cursor: pointer; text-transform: uppercase; 
            transition: 0.3s; letter-spacing: 1px;
        }

        .btn-game:hover {
            background: var(--blue); color: #000;
            box-shadow: 0 0 20px var(--blue);
        }

        .footer {
            text-align: center; font-size: 9px; margin-top: 20px; color: #555;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <canvas id="matrix"></canvas>

    <div class="container">
        <h3>NEXUS PANEL</h3>
        <div class="user-info">Status: <span style="color:var(--green)">Authorized Access</span></div>
        
        <div class="cat">Combat System</div>
        <div class="opt"><span>Aimlock 100%</span><input type="checkbox" onclick="send('Aim', '0x336371c', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>No Recoil</span><input type="checkbox" onclick="send('Recoil', '0x68a10dc', '0000A0E3', this.checked)"></div>

        <div class="cat">Movement Mod</div>
        <div class="opt"><span>SkyDive Speed</span><input type="checkbox" onclick="send('Sky', '0x6ef16e8', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>Fly Hack</span><input type="checkbox" onclick="send('Fly', '0x5ff59f4', '0000A0E3', this.checked)"></div>

        <div class="cat">Visual Graphics</div>
        <div class="opt"><span>Wallhack</span><input type="checkbox" onclick="send('Wall', '0x3360e0c', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>Antena Head</span><input type="checkbox" onclick="send('Antena', '0x3357530', '0000A0E3', this.checked)"></div>

        <button class="btn-game" onclick="Android.abrirJogo()">Execute Game Launcher</button>
        
        <div class="footer">NEXUS XITER VIP - INTERNAL BUILD 2026</div>
    </div>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
        const characters = "01";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillStyle = "#003300"; 
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // Core Functions
        function send(name, offset, hex, status) {
            // Vibração curta para feedback tátil (opcional)
            if (navigator.vibrate) navigator.vibrate(20);
            
            console.log(`Patching: ${name} | State: ${status}`);
            
            if (typeof Android !== 'undefined') {
                Android.applyPatch(name, offset, hex, status);
            }
        }

        // Bloqueio de inspeção básico
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
        }
    </script>
</body>
</html>
