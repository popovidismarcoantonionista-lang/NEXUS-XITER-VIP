<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS DUMP - OFFSETS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body { background: #000; font-family: 'Courier New', Courier, monospace; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* Fundo Matrix */
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .painel-card {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            z-index: 10;
        }

        .title { color: #00ffff; font-size: 1.5em; text-align: center; text-shadow: 0 0 10px #00ffff; margin-bottom: 20px; font-weight: bold; }

        .category { color: #00ff00; font-size: 0.75em; margin: 15px 0 5px 0; border-bottom: 1px solid rgba(0, 255, 0, 0.2); padding-bottom: 3px; }
        
        .hack-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0, 255, 255, 0.05); }
        .hack-name { color: #fff; font-size: 0.85em; letter-spacing: 1px; }

        /* Switch Redondo Ciano */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
        input:checked + .slider:before { transform: translateX(22px); }

        .start-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="painel-card">
        <div class="title">NEXUS DUMP</div>
        
        <div class="category">COMBATE</div>
        <div class="hack-item">
            <div class="hack-name">AimLock 100%</div>
            <label class="switch">
                <input type="checkbox" onchange="sendOffset('AimLock', '0x1234567', '0x0000C0BF', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="category">MOVIMENTAÇÃO</div>
        <div class="hack-item">
            <div class="hack-name">Velocidade Correr</div>
            <label class="switch">
                <input type="checkbox" onchange="sendOffset('Speed', '0x2345678', '0x40A00000', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="category">VISUAL</div>
        <div class="hack-item">
            <div class="hack-name">Antena Head</div>
            <label class="switch">
                <input type="checkbox" onchange="sendOffset('Antena', '0x3456789', '0x3F800000', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <button class="start-btn" onclick="abrirFF()">INICIAR FREE FIRE</button>
    </div>

    <script>
        // Matrix Animation
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight; canvas.width = window.innerWidth;
        const columns = canvas.width / 14;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffff";
            ctx.font = "14px monospace";
            drops.forEach((y, i) => {
                const text = Math.floor(Math.random() * 2);
                ctx.fillText(text, i * 14, y * 14);
                if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 35);

        // FUNÇÃO QUE ENVIA O OFFSET PARA O APP
        function sendOffset(name, offset, hex, status) {
            if (window.Android && window.Android.applyPatch) {
                // Envia para a ponte Java do Sketchware
                window.Android.applyPatch(name, offset, hex, status);
            }
        }

        function abrirFF() {
            if (window.Android) window.Android.abrirJogo();
        }
    </script>
</body>
</html>
