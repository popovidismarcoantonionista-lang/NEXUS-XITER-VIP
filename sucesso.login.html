<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS - PAINEL VIP</title>
    <style>
        :root { 
            --neon-blue: #00f7ff; 
            --neon-green: #00ff00; 
            --bg-dark: #000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 15px; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.2; }

        .container { 
            width: 100%; max-width: 320px; 
            background: rgba(0, 0, 0, 0.95); 
            border: 2.5px solid var(--neon-blue); 
            border-radius: 20px; 
            padding: 25px; 
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
        }

        h3 { 
            color: var(--neon-blue); 
            text-align: center; margin: 0 0 25px 0; 
            font-size: 26px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 4px; 
            text-shadow: 0 0 15px var(--neon-blue); 
        }

        .cat { 
            color: var(--neon-green); font-size: 11px; 
            text-transform: uppercase; font-weight: bold;
            border-bottom: 1.5px solid rgba(0, 255, 0, 0.2); 
            margin: 20px 0 15px; padding-bottom: 5px; 
            letter-spacing: 1px;
        }

        .opt { 
            display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 20px; 
        }

        .opt span { font-size: 16px; color: #fff; font-weight: 500; }
        
        /* Switch minimalista idêntico à foto */
        input[type="checkbox"] { 
            width: 46px; height: 24px; appearance: none; 
            background: #333; border-radius: 20px; 
            position: relative; cursor: pointer; transition: 0.3s; 
        }

        input[type="checkbox"]:checked { background: #444; }

        input[type="checkbox"]::before { 
            content: ''; position: absolute; width: 18px; height: 18px; 
            background: #fff; border-radius: 50%; 
            top: 3px; left: 4px; transition: 0.3s; 
        }

        input[type="checkbox"]:checked::before { 
            left: 24px; box-shadow: 0 0 12px #fff;
        }

        /* Botão Iniciar */
        .btn-game { 
            background: var(--neon-blue); 
            color: #000; border: none; width: 100%; 
            padding: 18px; font-size: 15px; font-weight: 900; 
            border-radius: 12px; margin-top: 15px; 
            cursor: pointer; text-transform: uppercase; 
            box-shadow: 0 0 20px var(--neon-blue);
            transition: 0.2s;
        }

        .btn-game:active { transform: scale(0.97); }
    </style>
</head>
<body oncontextmenu="return false;">
    <canvas id="matrix"></canvas>

    <div class="container">
        <h3>NEXUS DUMP</h3>
        
        <div class="cat">Combate</div>
        <div class="opt"><span>AimLock 100%</span><input type="checkbox" onclick="send('AimLock', '0x336371c', '0000A0E3', this.checked)"></div>

        <div class="cat">Movimentação</div>
        <div class="opt"><span>Velocidade Correr</span><input type="checkbox" onclick="send('Speed', '0x6ef16e8', '0000A0E3', this.checked)"></div>

        <div class="cat">Visual</div>
        <div class="opt"><span>Antena Head</span><input type="checkbox" onclick="send('Antena', '0x3357530', '0000A0E3', this.checked)"></div>

        <button class="btn-game" onclick="Android.abrirJogo()">INICIAR FREE FIRE</button>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrix'), ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight; canvas.width = window.innerWidth;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "15px monospace"; ctx.fillStyle = "#004400";
            drops.forEach((y, i) => {
                ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
                if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        // Envia os dados para o Java. O Toast nativo do APK cuidará do resto.
        function send(name, offset, hex, status) {
            if (navigator.vibrate) navigator.vibrate(25);
            
            if (typeof Android !== 'undefined') {
                Android.applyPatch(name, offset, hex, status);
            }
        }
    </script>
</body>
</html>
