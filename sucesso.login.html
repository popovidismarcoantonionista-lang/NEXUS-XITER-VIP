<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PANEL</title>
    <style>
        :root { --blue: #00f7ff; --green: #00ff00; }
        body { background: black; color: white; font-family: sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 300px; border: 2px solid var(--blue); border-radius: 15px; padding: 20px; background: rgba(0,15,0,0.9); box-shadow: 0 0 15px var(--blue); }
        h3 { color: var(--blue); text-align: center; margin-top: 0; text-shadow: 0 0 5px var(--blue); }
        .cat { color: var(--green); font-size: 10px; border-bottom: 1px solid #222; margin: 15px 0 10px; text-transform: uppercase; }
        .opt { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .opt span { font-size: 14px; }
        
        /* Checkbox Style */
        input[type="checkbox"] { width: 40px; height: 20px; appearance: none; background: #333; border-radius: 10px; position: relative; cursor: pointer; transition: 0.3s; }
        input[type="checkbox"]:checked { background: var(--blue); }
        input[type="checkbox"]::before { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        input[type="checkbox"]:checked::before { left: 22px; }

        .btn-game { background: var(--blue); color: black; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h3>NEXUS V2 VIP</h3>
        
        <div class="cat">Combate</div>
        <div class="opt"><span>Aimlock 100%</span><input type="checkbox" onclick="send('Aim', '0x336371c', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>No Recoil</span><input type="checkbox" onclick="send('Recoil', '0x68a10dc', '0000A0E3', this.checked)"></div>

        <div class="cat">Movimento</div>
        <div class="opt"><span>SkyDive Speed</span><input type="checkbox" onclick="send('Sky', '0x6ef16e8', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>Fly Hack</span><input type="checkbox" onclick="send('Fly', '0x5ff59f4', '0000A0E3', this.checked)"></div>

        <div class="cat">Visual</div>
        <div class="opt"><span>Wallhack</span><input type="checkbox" onclick="send('Wall', '0x3360e0c', '0000A0E3', this.checked)"></div>
        <div class="opt"><span>Antena Head</span><input type="checkbox" onclick="send('Antena', '0x3357530', '0000A0E3', this.checked)"></div>

        <button class="btn-game" onclick="Android.abrirJogo()">INICIAR FREE FIRE</button>
    </div>

    <script>
        function send(name, offset, hex, status) {
            if (typeof Android !== 'undefined') {
                Android.applyPatch(name, offset, hex, status);
            }
        }
    </script>
</body>
</html>
